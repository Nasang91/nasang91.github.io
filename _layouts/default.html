<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    {%- feed_meta -%}
  </head>
  <body>
    <div class="site-shell">
      <aside class="site-sidebar">
        <div>
          <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          <p class="site-tagline">AI coding agent와 orchestration을 다루는 개인 블로그</p>
        </div>

        <nav class="site-nav">
          <ul>
            {% for item in site.navigation %}
              <li>
                <a href="{{ item.url | relative_url }}" class="{% if page.url == item.url %}active{% endif %}">
                  {{ item.title }}
                </a>
              </li>
            {% endfor %}
          </ul>
        </nav>
      </aside>

      <main class="site-content">
        {% if page.title %}
          <header class="page-header">
            <h1>{{ page.title }}</h1>
            {% if page.description %}
              <p>{{ page.description }}</p>
            {% endif %}
          </header>
        {% endif %}

        {{ content }}
      </main>
    </div>
  </body>
</html>
